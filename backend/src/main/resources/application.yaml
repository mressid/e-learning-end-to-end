# Base configuration. Contains NO secrets and NO environment-specific hosts:
# everything sensitive is read from the environment (see backend/.env.example).
# Profile-specific overrides live in application-{profile}.yaml.

spring:
  application:
    name: elearning

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: elearning-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  jpa:
    # Flyway owns the schema; Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    placeholders:
      # The first super admin cannot be created through an API that requires a
      # super admin, so V6 seeds one. Overridden by environment in production;
      # the default password is a development convenience and the application
      # warns at startup while it is still in place.
      superAdminEmail: ${SUPER_ADMIN_EMAIL:admin@elearning.local}
      superAdminUsername: ${SUPER_ADMIN_USERNAME:superadmin}
      superAdminPasswordHash: ${SUPER_ADMIN_PASSWORD_HASH:{bcrypt}$2a$10$Qv2U9OWxpkiZcsO90LEdhO/c1JThh1kDWNDJqRULfQPXugqld.2UW}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      # Large media goes to object storage via presigned URLs, not through here.
      max-file-size: 25MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  error:
    # Never leak internals through the public API (AGENTS.md §29).
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  shutdown: graceful

# --- Application-owned configuration ----------------------------------------
# Consumed by @ConfigurationProperties classes in the matching modules.
elearning:
  api:
    base-path: /api/v1
  storage:
    # S3-compatible; MinIO locally, S3 in production.
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    # MinIO needs path-style; real S3 does not.
    path-style-access: ${STORAGE_PATH_STYLE:true}
    media-bucket: ${STORAGE_MEDIA_BUCKET:elearning}
    public-bucket: ${STORAGE_PUBLIC_BUCKET:elearning-public}
    presigned-url-ttl: 15m
  mail:
    from: ${MAIL_FROM:no-reply@elearning.local}
    # smtp (default, works with Mailpit and no credentials) or mailgun.
    provider: ${MAIL_PROVIDER:smtp}
    mailgun:
      api-key: ${MAILGUN_API_KEY:}
      domain: ${MAILGUN_DOMAIN:}
      # Mailgun runs separate US and EU stacks and MAIL_PROVIDER:smtp domain lives in exactly
      # one. The wrong host answers 401, which reads like a bad key.
      base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net}
  identity:
    # Off only where identity is established some other way. Accounts are then
    # created ACTIVE and no verification mail is sent.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    # Where the links in verification and reset emails point. This is the
    # front end, not the API: the user lands on a page that posts the token
    # back. Wrong here means every emailed link is dead.
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
  seed:
    # Reference data (categories, the permission catalogue, system roles) is
    # seeded from a JSON file on startup rather than from migrations, so adding
    # a category is a content change instead of a schema deployment. Idempotent
    # and never deletes, so it is safe to leave on.
    enabled: ${SEED_ENABLED:true}
    location: ${SEED_LOCATION:classpath:seed/reference-data.json}
  maintenance:
    # Housekeeping sweeps. Disable in environments where a second instance
    # would duplicate the work (see the note on multi-instance below).
    enabled: ${MAINTENANCE_ENABLED:true}
    pending-upload-grace: ${MAINTENANCE_PENDING_UPLOAD_GRACE:24h}
    batch-size: ${MAINTENANCE_BATCH_SIZE:200}
  security:
    jwt:
      # No default: a signing secret must never fall back to a built-in value.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:elearning}
      # Short: a signed JWT cannot be withdrawn, so this window is how long a
      # revoked session stays usable. The refresh token is the revocable half.
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
      email-verification-ttl: ${EMAIL_VERIFICATION_TTL:2d}
      password-reset-ttl: ${PASSWORD_RESET_TTL:30m}

# --- OpenAPI / Swagger UI ----------------------------------------------------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
    doc-expansion: none
  paths-to-match: /api/**
  show-actuator: false
  default-produces-media-type: application/json
  # Stable ordering so the generated spec diffs cleanly in review.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  # Surface the request id (set by RequestIdFilter) on every line, so a user
  # reporting an X-Request-Id can be traced straight to their request.
  pattern:
    level: "%5p [%X{requestId:-no-request}]"
  level:
    root: INFO
    com.elearning: INFO
