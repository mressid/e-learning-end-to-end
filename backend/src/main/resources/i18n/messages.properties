# General HTTP & Framework errors
VALIDATION_FAILED=Request validation failed
MALFORMED_REQUEST=Request body could not be parsed
INVALID_PARAMETER=Request parameter is invalid
INVALID_VALUE=has an invalid value
METHOD_NOT_ALLOWED=That method is not supported on this endpoint
UNAUTHORIZED=Authentication is required
FORBIDDEN=You are not allowed to perform this operation
NOT_FOUND=Resource not found
CONSTRAINT_VIOLATION=The request conflicts with existing data
INTERNAL_ERROR=An unexpected error occurred

# Identity Module
USER_NOT_FOUND=User not found
EMAIL_ALREADY_REGISTERED=That email address is already registered
USERNAME_TAKEN=That username is already taken
PROFILE_NOT_FOUND=Profile not found
INVALID_STATUS=Invalid user status
INVALID_CREDENTIALS=Invalid email or password
INVALID_TOKEN=Invalid or expired token
INVALID_VERIFICATION_TOKEN=That verification link is invalid or has expired
ALREADY_VERIFIED=This address is already verified
INVALID_RESET_TOKEN=That reset link is invalid or has expired
AVATAR_MUST_BE_PUBLIC=Upload the avatar with visibility PUBLIC
MEDIA_ACCESS_DENIED=This media object is not yours

# Course Module
COURSE_NOT_FOUND=Course not found
COURSE_EXISTS=A course with that slug already exists
CANNOT_EDIT_PUBLISHED=Published courses cannot be modified directly
COURSE_NOT_PUBLISHABLE=Course cannot be published
SECTION_NOT_FOUND=Section not found
ITEM_NOT_FOUND=Item not found
COURSE_ITEM_NOT_FOUND=Course item not found
DUPLICATE_IN_ORDER=The order lists the same entry twice
INCOMPLETE_ORDER=The order must list every entry exactly once
ITEM_HAS_STUDENT_ACTIVITY=Cannot delete: item contains student activity
CATEGORY_NOT_FOUND=No such category
CATEGORY_EXISTS=A category with that name already exists
CATEGORY_HAS_CHILDREN=Remove or re-parent its subcategories first
CATEGORY_IN_USE={0} course(s) are still in this category
TOO_MANY_TAGS=A course may carry at most {0} tags
INSTRUCTOR_NOT_FOUND=Instructor not found
ALREADY_INSTRUCTOR=This instructor is already assigned to the course
LAST_INSTRUCTOR=A course must have at least one instructor

# Learning Module
ENROLLMENT_NOT_FOUND=Enrollment not found
ALREADY_ENROLLED=You are already enrolled in this course
COURSE_NOT_PUBLISHED=You cannot enroll in an unpublished course
PREREQUISITES_NOT_MET=You have not completed the required prerequisites
LESSON_NOT_FOUND=Lesson not found
RESOURCE_NOT_FOUND=Resource not found
CERTIFICATE_NOT_FOUND=Certificate not found
CERTIFICATE_NOT_READY=Course requirements are not fully completed

# Assessment Module
ASSIGNMENT_NOT_FOUND=Assignment not found
SUBMISSION_NOT_FOUND=Submission not found
ALREADY_SUBMITTED=You have already submitted this assignment
SUBMISSION_PAST_DEADLINE=Submissions are closed for this assignment
QUIZ_NOT_FOUND=Quiz not found
QUESTION_NOT_FOUND=Question not found
QUIZ_ATTEMPT_NOT_FOUND=Quiz attempt not found
NO_ACTIVE_ATTEMPT=No active attempt found
ATTEMPT_ALREADY_SUBMITTED=This attempt has already been submitted
QUIZ_ATTEMPT_LIMIT_REACHED=You have reached the maximum number of attempts
QUIZ_TIME_LIMIT_EXCEEDED=Time limit exceeded for this quiz

# Platform Module
MEDIA_NOT_FOUND=Media object not found
MIME_TYPE_REQUIRED=A content type is required
SIZE_REQUIRED=A resumable upload needs the file size
INVALID_PART_NUMBER=Part numbers run from 1 to {0}
NO_PARTS=An upload needs at least one part
UPLOAD_NOT_FOUND=No uploaded file was found for this media object
MEDIA_NOT_AVAILABLE=This media object has no completed upload
NOT_A_RESUMABLE_UPLOAD=This upload has already finished, or was never resumable
MEDIA_IN_USE=Cannot delete: this file is still in use
NOTIFICATION_NOT_FOUND=Notification not found
NOTIFICATION_ACCESS_DENIED=This notification is not yours
VARIANT_NOT_FOUND=This video has no such rendition
LESSON_HAS_NO_VIDEO=This lesson has no video
STREAM_NOT_READY=This video is still being processed; the original download still works

# Admin Module
ADMIN_NOT_FOUND=No such administrator
ROLE_NOT_FOUND=No such role
ROLE_EXISTS=A role with that name already exists
SUPER_ROLE_IMMUTABLE=The super admin role always holds every permission and cannot be edited
SYSTEM_ROLE=A system role cannot be deleted
LAST_SUPER_ADMIN=The last super admin cannot be demoted or suspended
PERMISSION_NOT_FOUND=No such permission: {0}
SESSION_NOT_FOUND=No such session
CANNOT_RESET_OWN_PASSWORD=Change your own password through the account security settings
