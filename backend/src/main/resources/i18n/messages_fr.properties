# General HTTP & Framework errors
VALIDATION_FAILED=La validation de la requête a échoué
MALFORMED_REQUEST=Le corps de la requête n'a pas pu être analysé
INVALID_PARAMETER=Le paramètre de requête est invalide
INVALID_VALUE=a une valeur invalide
METHOD_NOT_ALLOWED=Cette méthode n'est pas prise en charge sur ce point de terminaison
UNAUTHORIZED=Une authentification est requise
FORBIDDEN=Vous n'êtes pas autorisé à effectuer cette opération
NOT_FOUND=Ressource introuvable
CONSTRAINT_VIOLATION=La requête entre en conflit avec des données existantes
INTERNAL_ERROR=Une erreur inattendue est survenue

# Identity Module
USER_NOT_FOUND=Utilisateur introuvable
EMAIL_ALREADY_REGISTERED=Cette adresse e-mail est déjà enregistrée
USERNAME_TAKEN=Ce nom d'utilisateur est déjà pris
PROFILE_NOT_FOUND=Profil introuvable
INVALID_STATUS=Statut d'utilisateur invalide
INVALID_CREDENTIALS=Adresse e-mail ou mot de passe invalide
INVALID_TOKEN=Jeton invalide ou expiré
INVALID_VERIFICATION_TOKEN=Ce lien de vérification est invalide ou a expiré
ALREADY_VERIFIED=Cette adresse est déjà vérifiée
INVALID_RESET_TOKEN=Ce lien de réinitialisation est invalide ou a expiré
AVATAR_MUST_BE_PUBLIC=Téléversez l'avatar avec une visibilité PUBLIQUE
MEDIA_ACCESS_DENIED=Cet objet multimédia ne vous appartient pas

# Course Module
COURSE_NOT_FOUND=Cours introuvable
COURSE_EXISTS=Un cours avec ce slug existe déjà
CANNOT_EDIT_PUBLISHED=Les cours publiés ne peuvent pas être modifiés directement
COURSE_NOT_PUBLISHABLE=Le cours ne peut pas être publié
SECTION_NOT_FOUND=Section introuvable
ITEM_NOT_FOUND=Élément introuvable
COURSE_ITEM_NOT_FOUND=Élément de cours introuvable
DUPLICATE_IN_ORDER=L'ordre spécifié contient des doublons
INCOMPLETE_ORDER=L'ordre doit inclure chaque élément exactement une fois
ITEM_HAS_STUDENT_ACTIVITY=Suppression impossible : l'élément contient une activité étudiante
CATEGORY_NOT_FOUND=Catégorie introuvable
CATEGORY_EXISTS=Une catégorie portant ce nom existe déjà
CATEGORY_HAS_CHILDREN=Supprimez ou réassociez d'abord ses sous-catégories
CATEGORY_IN_USE={0} cours sont encore associés à cette catégorie
TOO_MANY_TAGS=Un cours peut comporter au maximum {0} étiquettes
INSTRUCTOR_NOT_FOUND=Instructeur introuvable
ALREADY_INSTRUCTOR=Cet instructeur est déjà assigné au cours
LAST_INSTRUCTOR=Un cours doit avoir au moins un instructeur

# Learning Module
ENROLLMENT_NOT_FOUND=Inscription introuvable
ALREADY_ENROLLED=Vous êtes déjà inscrit à ce cours
COURSE_NOT_PUBLISHED=Vous ne pouvez pas vous inscrire à un cours non publié
PREREQUISITES_NOT_MET=Vous n'avez pas complété les prérequis obligatoires
LESSON_NOT_FOUND=Leçon introuvable
RESOURCE_NOT_FOUND=Ressource introuvable
CERTIFICATE_NOT_FOUND=Certificat introuvable
CERTIFICATE_NOT_READY=Les exigences du cours ne sont pas entièrement satisfaites

# Assessment Module
ASSIGNMENT_NOT_FOUND=Devoir introuvable
SUBMISSION_NOT_FOUND=Soumission introuvable
ALREADY_SUBMITTED=Vous avez déjà soumis ce devoir
SUBMISSION_PAST_DEADLINE=Les soumissions sont fermées pour ce devoir
QUIZ_NOT_FOUND=Quiz introuvable
QUESTION_NOT_FOUND=Question introuvable
QUIZ_ATTEMPT_NOT_FOUND=Tentative de quiz introuvable
NO_ACTIVE_ATTEMPT=Aucune tentative active trouvée
ATTEMPT_ALREADY_SUBMITTED=Cette tentative a déjà été soumise
QUIZ_ATTEMPT_LIMIT_REACHED=Vous avez atteint le nombre maximal de tentatives
QUIZ_TIME_LIMIT_EXCEEDED=Limite de temps dépassée pour ce quiz

# Platform Module
MEDIA_NOT_FOUND=Objet multimédia introuvable
MIME_TYPE_REQUIRED=Un type de contenu est requis
SIZE_REQUIRED=Un téléversement fractionné nécessite la taille du fichier
INVALID_PART_NUMBER=Les numéros de partie vont de 1 à {0}
NO_PARTS=Un téléversement nécessite au moins une partie
UPLOAD_NOT_FOUND=Aucun fichier téléversé n'a été trouvé pour cet objet multimédia
MEDIA_NOT_AVAILABLE=Cet objet multimédia n'a pas de téléversement terminé
NOT_A_RESUMABLE_UPLOAD=Ce téléversement est déjà terminé ou n'a jamais été fractionné
MEDIA_IN_USE=Suppression impossible : ce fichier est toujours utilisé
NOTIFICATION_NOT_FOUND=Notification introuvable
NOTIFICATION_ACCESS_DENIED=Cette notification ne vous appartient pas
VARIANT_NOT_FOUND=Cette vidéo n'a pas cette résolution
LESSON_HAS_NO_VIDEO=Cette leçon n'a pas de vidéo
STREAM_NOT_READY=Cette vidéo est en cours de traitement ; le téléchargement original fonctionne toujours

# Admin Module
ADMIN_NOT_FOUND=Administrateur introuvable
ROLE_NOT_FOUND=Rôle introuvable
ROLE_EXISTS=Un rôle portant ce nom existe déjà
SUPER_ROLE_IMMUTABLE=Le rôle de super administrateur détient toujours toutes les permissions et ne peut être modifié
SYSTEM_ROLE=Un rôle système ne peut pas être supprimé
LAST_SUPER_ADMIN=Le dernier super administrateur ne peut pas être rétrogradé ou suspendu
PERMISSION_NOT_FOUND=Permission introuvable : {0}
SESSION_NOT_FOUND=Session introuvable
CANNOT_RESET_OWN_PASSWORD=Modifiez votre propre mot de passe via les paramètres de sécurité
